{% extends 'mainpage/base.html' %}
{% block title %}Confirm delete - FitLifeGuide{% endblock %}

{% block content %}
<div class="fl-card fl-delete-card">
    <div class="fl-label fl-lime">Confirm deletion</div>
    <h1 class="fl-h fl-page-title">Delete this item?</h1>
    <p class="fl-muted">This cannot be undone.</p>
    {% if object.title %}<p class="fl-delete-title">{{ object.title }}</p>{% endif %}
    <form method="post" class="fl-form-actions">
        {% csrf_token %}
        <button type="submit" class="fl-btn fl-btn-danger">Delete</button>
        <a class="fl-btn fl-btn-secondary" href="{% if cancel_url %}{{ cancel_url }}{% else %}{% url 'posts' %}{% endif %}">Cancel</a>
    </form>
</div>
{% endblock %}
