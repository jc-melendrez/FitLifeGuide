{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FitLifeGuide account access">
    <title>{% block title %}FitLifeGuide{% endblock %}</title>

    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'mainpage/styles.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="fl fl-auth-body">
    <main class="fl-auth-shell">
        <a class="fl-logo" href="{% url 'welcome' %}">Fit<span class="fl-lime">Life</span>Guide</a>
        {% block content %}{% endblock %}
    </main>
    {% block extra_js %}{% endblock %}
</body>
</html>
